name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build, Unit & Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:server

  visual:
    name: Visual & Layout Regression
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install chromium --with-deps
      - name: Start Vite dev server and run visual checks
        run: |
          npm start &
          DEV_PID=$!
          trap "kill $DEV_PID 2>/dev/null || true" EXIT
          for i in $(seq 1 30); do
            curl -sf http://localhost:1234/ > /dev/null && break
            sleep 0.5
          done
          npm run check:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-screenshots
          path: test/visual/out
          retention-days: 7
